name: Patch runtime cold-start retry

on:
  push:
    paths:
      - '.github/workflows/patch-runtime-cold-start.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch runtime cold-start retry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend engine health retry
        run: |
          python -c "from pathlib import Path; import re,base64; p=Path('server.ts'); s=p.read_text(); pattern=re.compile(r'async function pingEngine\\(url\\?: string \\| null\\): Promise<EngineStatus> \\{.*?\\n\\}\\n\\nasync function readPackageJson', re.S); repl=base64.b64decode('').decode(); new_s,count=pattern.subn(repl,s,count=1); assert count==1, f'pingEngine block count={count}'; p.write_text(new_s)"
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - name: Commit patch
        run: |
          git config user.name 'NAWAF HQ Automation'
          git config user.email 'nawaf-hq@users.noreply.github.com'
          git add server.ts
          git commit -m 'Retry sleeping runtime health checks'
          git push origin HEAD:main

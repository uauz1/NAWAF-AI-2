name: Patch runtime cold-start health check

on:
  push:
    paths:
      - '.github/workflows/patch-runtime-cold-start.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch runtime cold-start health check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend engine health timeout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          old = "AbortSignal.timeout(5000)"
          new = "AbortSignal.timeout(70000)"
          if old not in s:
              raise SystemExit('Expected 5s engine timeout marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - name: Commit patch
        run: |
          git config user.name 'NAWAF HQ Automation'
          git config user.email 'nawaf-hq@users.noreply.github.com'
          git add server.ts
          git commit -m 'Handle free-runtime cold starts truthfully'
          git push origin HEAD:main

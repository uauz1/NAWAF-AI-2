name: Direct runtime diagnostic

on:
  push:
    paths:
      - '.github/workflows/runtime-direct-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Curl runtime health directly
        run: |
          set -x
          curl -i -L --max-time 120 https://nawaf-hq-crewai-runtime.onrender.com/health || true
          echo '---'
          curl -i -L --max-time 120 https://nawaf-hq-crewai-runtime.onrender.com/status || true
